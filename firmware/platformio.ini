; NuiLED ファーム（ホロフレ展示ケース 桃鈴ねね ソロライブ仕様）
; ターゲット: Seeed XIAO ESP32-S3 / Arduinoフレームワーク
; 段階1: LED + タクトSW + NVS永続化 + 母線EN（単体動作フル機能）
; 段階2: BLE(NimBLE) ①プリセット作成・転送。②リアルタイムは予約スタブ
; コア: Arduino-ESP32 2.0.17 (IDF4.4) → NimBLE 1.4系が整合

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

lib_deps =
    fastled/FastLED@^3.7.0
    h2zero/NimBLE-Arduino@^1.4.1

build_flags =
    -DCORE_DEBUG_LEVEL=0
