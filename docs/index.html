<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NuiLED コントローラ</title>
<style>
  :root {
    --bg:#f5f5f7; --card:#ffffff; --fg:#1d1d1f; --sub:#6e6e73;
    --border:#d2d2d7; --accent:#e0507a; --accent2:#f0912f; --ok:#2e9e5b; --ng:#c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161618; --card:#232326; --fg:#f5f5f7; --sub:#9a9aa0; --border:#3a3a3e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); line-height:1.5; }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:.2em 0; }
  .sub { color:var(--sub); font-size:.85rem; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px;
          padding:14px; margin:12px 0; }
  .card h2 { font-size:.95rem; margin:0 0 10px; color:var(--sub); font-weight:600;
             text-transform:uppercase; letter-spacing:.04em; }
  button { font:inherit; padding:9px 14px; border-radius:9px; border:1px solid var(--border);
           background:var(--card); color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:0 0 auto; }
  .grid8 { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .slot { text-align:center; padding:10px 0; }
  .slot.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  label { font-size:.85rem; color:var(--sub); display:block; margin:10px 0 3px; }
  select, input[type=range] { width:100%; font:inherit; padding:6px; border-radius:8px;
           border:1px solid var(--border); background:var(--card); color:var(--fg); }
  .colors { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .colors label { text-align:center; }
  input[type=color] { width:100%; height:40px; border:1px solid var(--border);
           border-radius:8px; background:none; cursor:pointer; }
  .checks { display:flex; gap:16px; margin-top:10px; }
  .checks label { display:flex; align-items:center; gap:6px; margin:0; }
  #status { font-size:.85rem; padding:6px 10px; border-radius:8px; display:inline-block; }
  .disconnected { color:var(--ng); } .connected { color:var(--ok); }
  .hint { font-size:.8rem; color:var(--sub); margin-top:8px; }
  .disabled { pointer-events:none; opacity:.45; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🩷 NuiLED コントローラ</h1>
  <div class="sub">ホロフレ展示ケース（桃鈴ねね ソロライブ仕様）</div>

  <div class="card">
    <div class="row">
      <button id="btnConnect" class="primary">接続</button>
      <span id="status" class="disconnected">未接続</span>
    </div>
    <div class="hint">Android Chrome / PC Chrome・Edge で動作（iOSはBluefy等が必要）。</div>
  </div>

  <div id="panel" class="disabled">
    <!-- 全体操作 -->
    <div class="card">
      <h2>全体</h2>
      <div class="row">
        <button id="btnPower">電源 ON/OFF</button>
        <span class="sub">明るさ:</span>
        <button class="bri" data-i="0">30%</button>
        <button class="bri" data-i="1">50%</button>
        <button class="bri" data-i="2">70%</button>
        <button class="bri" data-i="3">100%</button>
      </div>
      <div class="row" style="margin-top:10px">
        <span class="sub">チャンネル:</span>
        <button class="ch" data-m="3">両方</button>
        <button class="ch" data-m="1">Frontのみ</button>
        <button class="ch" data-m="2">Backのみ</button>
      </div>
    </div>

    <!-- スロット選択 -->
    <div class="card">
      <h2>プリセット スロット</h2>
      <div class="grid8" id="slots"></div>
      <div class="hint">タップで読込→編集。「適用」で点灯に反映、「全保存」で本体へ永続化。</div>
    </div>

    <!-- プリセット編集 -->
    <div class="card">
      <h2>編集（スロット <span id="editSlot">-</span>）</h2>
      <label>演出</label>
      <select id="effect">
        <option value="0">Solid（点灯）</option>
        <option value="1">Breath（ブレス）</option>
        <option value="2">Wave（ウェーブ）</option>
        <option value="3">Chase（チェイス）</option>
      </select>
      <label>速度 <span id="speedVal">128</span></label>
      <input type="range" id="speed" min="0" max="255" value="128">
      <div class="colors">
        <div><label>Front</label><input type="color" id="cFront" value="#ff9141"></div>
        <div><label>Back A</label><input type="color" id="cBackA" value="#ff285a"></div>
        <div><label>Back B</label><input type="color" id="cBackB" value="#ff5a00"></div>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="enFront" checked> Front有効</label>
        <label><input type="checkbox" id="enBack" checked> Back有効</label>
      </div>
      <div class="row" style="margin-top:14px">
        <button id="btnWrite">デバイスへ書込</button>
        <button id="btnApply" class="primary">このスロットを適用</button>
      </div>
    </div>

    <!-- 保存 -->
    <div class="card">
      <h2>永続化</h2>
      <div class="row">
        <button id="btnSave" class="primary">全スロットを本体保存（NVS）</button>
        <button id="btnFactory">工場出荷に戻す</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== GATT定義（ファームと一致）=====
const UUID = {
  svc:  'a1b20001-5c3d-4e6f-8a90-1234567890ab',
  state:'a1b20002-5c3d-4e6f-8a90-1234567890ab',
  slot: 'a1b20003-5c3d-4e6f-8a90-1234567890ab',
  pdata:'a1b20004-5c3d-4e6f-8a90-1234567890ab',
  cmd:  'a1b20005-5c3d-4e6f-8a90-1234567890ab',
};
const CMD = { APPLY:0x01, SAVE:0x02, FACTORY:0x03, POWER:0x05, BRIGHTNESS:0x06, CHANNEL:0x07 };

let dev, chState, chSlot, chPData, chCmd;
let numSlots = 8, editSlot = 0, activeSlot = 0;

const $ = id => document.getElementById(id);
const statusEl = $('status');

function setStatus(text, ok) {
  statusEl.textContent = text;
  statusEl.className = ok ? 'connected' : 'disconnected';
}

async function writeChar(ch, dataArr) {
  const buf = new Uint8Array(dataArr);
  if (ch.writeValueWithResponse) await ch.writeValueWithResponse(buf);
  else await ch.writeValue(buf);
}

// ===== 接続 =====
$('btnConnect').onclick = async () => {
  try {
    dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [UUID.svc] }, { name: 'NuiLED' }],
      optionalServices: [UUID.svc],
    });
    dev.addEventListener('gattserverdisconnected', onDisconnect);
    const server = await dev.gatt.connect();
    const svc = await server.getPrimaryService(UUID.svc);
    chState = await svc.getCharacteristic(UUID.state);
    chSlot  = await svc.getCharacteristic(UUID.slot);
    chPData = await svc.getCharacteristic(UUID.pdata);
    chCmd   = await svc.getCharacteristic(UUID.cmd);

    await chState.startNotifications();
    chState.addEventListener('characteristicvaluechanged', e => parseState(e.target.value));
    parseState(await chState.readValue());

    buildSlots();
    await loadSlot(activeSlot);
    $('panel').classList.remove('disabled');
    setStatus('接続済み', true);
  } catch (err) {
    setStatus('接続失敗: ' + err.message, false);
  }
};

function onDisconnect() {
  setStatus('切断', false);
  $('panel').classList.add('disabled');
}

// ===== State =====
function parseState(dv) {
  const powerOn = dv.getUint8(0);
  const briIdx  = dv.getUint8(1);
  activeSlot    = dv.getUint8(2);
  const chMask  = dv.getUint8(3);
  numSlots      = dv.getUint8(4) || 8;
  // ハイライト更新
  document.querySelectorAll('.slot').forEach(b =>
    b.classList.toggle('active', Number(b.dataset.s) === activeSlot));
  $('btnPower').textContent = powerOn ? '電源 OFF' : '電源 ON';
}

// ===== スロット =====
function buildSlots() {
  const box = $('slots'); box.innerHTML = '';
  for (let i = 0; i < numSlots; i++) {
    const b = document.createElement('button');
    b.className = 'slot' + (i === activeSlot ? ' active' : '');
    b.textContent = i; b.dataset.s = i;
    b.onclick = () => loadSlot(i);
    box.appendChild(b);
  }
}

async function loadSlot(i) {
  editSlot = i;
  $('editSlot').textContent = i;
  await writeChar(chSlot, [i]);          // 編集対象を選択
  const dv = await chPData.readValue();  // Preset(12byte)読込
  fillEditor(dv);
}

function fillEditor(dv) {
  $('effect').value = dv.getUint8(0);
  $('speed').value = dv.getUint8(1);  $('speedVal').textContent = dv.getUint8(1);
  $('cFront').value = rgbHex(dv, 2);
  $('cBackA').value = rgbHex(dv, 5);
  $('cBackB').value = rgbHex(dv, 8);
  const flags = dv.getUint8(11);
  $('enFront').checked = !!(flags & 1);
  $('enBack').checked  = !!(flags & 2);
}

function rgbHex(dv, o) {
  const h = n => n.toString(16).padStart(2, '0');
  return '#' + h(dv.getUint8(o)) + h(dv.getUint8(o+1)) + h(dv.getUint8(o+2));
}
function hexRgb(hex) {
  return [parseInt(hex.substr(1,2),16), parseInt(hex.substr(3,2),16), parseInt(hex.substr(5,2),16)];
}

function editorToBytes() {
  const f = hexRgb($('cFront').value);
  const a = hexRgb($('cBackA').value);
  const b = hexRgb($('cBackB').value);
  const flags = ($('enFront').checked ? 1 : 0) | ($('enBack').checked ? 2 : 0);
  return [Number($('effect').value), Number($('speed').value),
          f[0],f[1],f[2], a[0],a[1],a[2], b[0],b[1],b[2], flags];
}

$('speed').oninput = () => $('speedVal').textContent = $('speed').value;

// ===== 操作 =====
$('btnWrite').onclick   = async () => { await writeChar(chSlot,[editSlot]);
                                        await writeChar(chPData, editorToBytes()); };
$('btnApply').onclick   = async () => { await writeChar(chSlot,[editSlot]);
                                        await writeChar(chPData, editorToBytes());
                                        await writeChar(chCmd,[CMD.APPLY, editSlot]); };
$('btnSave').onclick    = () => writeChar(chCmd,[CMD.SAVE]);
$('btnFactory').onclick = async () => { if(confirm('全スロットを工場出荷に戻します。よろしいですか？'))
                                        { await writeChar(chCmd,[CMD.FACTORY]); await loadSlot(editSlot); } };
$('btnPower').onclick   = () => { const on = $('btnPower').textContent.includes('ON');
                                  writeChar(chCmd,[CMD.POWER, on?1:0]); };
document.querySelectorAll('.bri').forEach(b =>
  b.onclick = () => writeChar(chCmd,[CMD.BRIGHTNESS, Number(b.dataset.i)]));
document.querySelectorAll('.ch').forEach(b =>
  b.onclick = () => writeChar(chCmd,[CMD.CHANNEL, Number(b.dataset.m)]));

if (!navigator.bluetooth) {
  setStatus('このブラウザはWeb Bluetooth非対応', false);
  $('btnConnect').disabled = true;
}
</script>
</body>
</html>
