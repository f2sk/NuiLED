<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NuiLED</title>
<style>
  :root{
    --bg:#fafafa; --panel:#fff; --fg:#18181b; --sub:#71717a; --line:#e4e4e7;
    --fill:#18181b; --fillfg:#fafafa; --hover:#f4f4f5; --danger:#b91c1c;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e0e10; --panel:#1a1a1d; --fg:#e7e7ea; --sub:#8b8b92; --line:#2a2a2e;
           --fill:#e7e7ea; --fillfg:#0e0e10; --hover:#242427; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  header h1{font-size:1.15rem;font-weight:600;letter-spacing:.02em;margin:0}
  header .v{font-size:.75rem;color:var(--sub)}
  section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}
  .shead{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
         color:var(--sub);margin:0 0 12px}
  button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);
         border-radius:7px;padding:7px 12px;cursor:pointer}
  button:hover{background:var(--hover)}
  button.fill{background:var(--fill);color:var(--fillfg);border-color:var(--fill)}
  button.sm{padding:4px 9px;font-size:.82rem}
  button:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .between{justify-content:space-between}
  .muted{color:var(--sub);font-size:.82rem}
  #dot{width:8px;height:8px;border-radius:50%;background:var(--sub);display:inline-block}
  #dot.on{background:#16a34a}
  /* tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;
       padding:8px 14px;color:var(--sub);font-weight:600}
  .tabs button.act{color:var(--fg);border-bottom-color:var(--fill)}
  .tabpage{display:none} .tabpage.act{display:block}
  /* slot list */
  .slots{display:flex;flex-direction:column;gap:8px}
  .slotcard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
       padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
  .slotcard:hover{background:var(--hover)}
  .slotcard.active{border-color:var(--fill);box-shadow:inset 0 0 0 1px var(--fill)}
  .slotcard .no{font-weight:600;font-variant-numeric:tabular-nums;width:1.4em;text-align:center}
  .slotcard .info{flex:1;min-width:0}
  .slotcard .cline{display:flex;align-items:center;gap:6px;font-size:.85rem}
  .slotcard .tag{color:var(--sub);width:1.1em}
  .badge{font-size:.68rem;color:var(--fillfg);background:var(--fill);border-radius:4px;padding:1px 6px}
  .swatch{display:inline-flex;gap:2px}
  .swatch i{width:12px;height:12px;border-radius:2px;display:block;border:1px solid rgba(128,128,128,.3)}
  /* library */
  ul.lib{list-style:none;margin:0;padding:0}
  ul.lib li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
  ul.lib li:first-child{border-top:0}
  ul.lib li.sel{font-weight:600}
  ul.lib .name{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* fields */
  label{display:block;font-size:.78rem;color:var(--sub);margin:12px 0 4px}
  input[type=text],select{width:100%;font:inherit;color:var(--fg);background:var(--bg);
       border:1px solid var(--line);border-radius:7px;padding:8px}
  input[type=range]{width:100%}
  .val{font-variant-numeric:tabular-nums;color:var(--sub);font-size:.8rem}
  .chan{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}
  .chan h3{margin:0;font-size:.9rem;font-weight:600}
  .pal{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .pal .c{position:relative}
  .pal input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line);
       border-radius:6px;background:none;cursor:pointer}
  .pal .x{position:absolute;top:-6px;right:-6px;width:16px;height:16px;line-height:14px;
       text-align:center;border-radius:50%;background:var(--fill);color:var(--fillfg);
       border:none;font-size:11px;cursor:pointer;padding:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .note{font-size:.78rem;color:var(--sub);margin-top:10px}
  .hide{display:none!important}
  canvas.preview{width:100%;height:22px;display:block;margin-top:4px;border-radius:5px;
       background:#000;border:1px solid var(--line)}
  .offline{pointer-events:none;opacity:.45}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>NuiLED</h1><span class="v">controller</span></header>

  <!-- 接続（共通） -->
  <section>
    <div class="row between">
      <div class="row"><span id="dot"></span><span id="connText" class="muted">未接続</span></div>
      <div class="row">
        <button id="btnConnect" class="fill sm">接続</button>
        <button id="btnDisconnect" class="sm hide">切断</button>
      </div>
    </div>
    <div class="note" id="btEnv"></div>
  </section>

  <!-- タブ -->
  <div class="tabs">
    <button id="tabBtnOp" class="act">操作パネル</button>
    <button id="tabBtnCr">プリセット作成</button>
  </div>

  <!-- ===== 操作パネル ===== -->
  <div id="pageOp" class="tabpage act">
    <section id="opGlobal" class="offline">
      <h2 class="shead">全体</h2>
      <div class="row">
        <button id="btnPower" class="sm">電源</button>
        <span class="muted">明るさ</span>
        <button class="bri sm" data-i="0">30</button>
        <button class="bri sm" data-i="1">50</button>
        <button class="bri sm" data-i="2">70</button>
        <button class="bri sm" data-i="3">100</button>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="muted">出力</span>
        <button id="chAll" class="sm">全て</button>
        <button class="chtog sm" data-b="1">Front</button>
        <button class="chtog sm" data-b="2">Back</button>
        <button class="chtog sm" data-b="4">Ground</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="btnSwapLive" class="sm">現在モードの Front⇄Back 入れ替え</button>
      </div>
    </section>

    <section id="opSlots" class="offline">
      <div class="row between"><h2 class="shead" style="margin:0">本体モード（スロット）</h2>
        <button id="btnSync" class="sm">↻ 同期</button></div>
      <div class="slots" id="slotList"></div>
      <div class="note">タップで本体に適用＝その場で点灯。本体ボタンSW2でも順送りできる。</div>
    </section>

    <section id="opHint" class="note">接続すると本体の8モードが一覧表示されます。</section>
  </div>

  <!-- ===== プリセット作成 ===== -->
  <div id="pageCr" class="tabpage">
    <section>
      <div class="row between"><h2 class="shead" style="margin:0">ライブラリ（この端末に保存）</h2>
        <button id="btnNew" class="sm">＋ 新規</button></div>
      <ul class="lib" id="libList"></ul>
      <div class="note">未接続でも作成・編集・保存できます。</div>
    </section>

    <section id="editor">
      <h2 class="shead">編集</h2>
      <label>名前</label>
      <input type="text" id="pName" placeholder="プリセット名">
      <div class="row" style="margin-top:12px">
        <label style="margin:0"><input type="checkbox" id="enFront"> Front（照明）</label>
        <label style="margin:0"><input type="checkbox" id="enBack"> Back（背景）</label>
        <label style="margin:0"><input type="checkbox" id="enGround"> Ground（床）</label>
      </div>
      <div id="chFront"></div>
      <div id="chBack"></div>
      <div id="chGround"></div>
      <div class="row" style="margin-top:14px">
        <button id="btnSwapFB" class="sm">Front⇄Back 入れ替え</button>
        <button id="btnDup" class="sm">複製</button>
        <button id="btnDel" class="sm" style="color:var(--danger)">削除</button>
      </div>
    </section>

    <section id="crXfer" class="offline">
      <h2 class="shead">本体へ転送（接続時）</h2>
      <div class="grid2">
        <select id="devSlot"></select>
        <button id="btnImport" class="sm">このスロットを取込</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="btnSend" class="fill sm">スロットへ書込＋適用</button>
        <button id="btnSaveNvs" class="sm">本体に保存(NVS)</button>
        <button id="btnFactory" class="sm">工場出荷</button>
      </div>
      <div class="note">「書込＋適用」で選択スロットへ送って点灯。恒久化は「本体に保存」。</div>
    </section>
  </div>
</div>

<script>
"use strict";
const MAX_COLORS = 6;
const EFFECTS = ["単色","ブレス","交互","ウェーブ","チェイス"];
const LS_KEY = "nuiled.library";
const UUID = {
  svc:'a1b20001-5c3d-4e6f-8a90-1234567890ab', state:'a1b20002-5c3d-4e6f-8a90-1234567890ab',
  slot:'a1b20003-5c3d-4e6f-8a90-1234567890ab', pdata:'a1b20004-5c3d-4e6f-8a90-1234567890ab',
  cmd:'a1b20005-5c3d-4e6f-8a90-1234567890ab' };
const CMD = { APPLY:1, SAVE:2, FACTORY:3, POWER:5, BRIGHTNESS:6, CHANNEL:7 };
const $ = id => document.getElementById(id);

// ===== データモデル =====
const newChan = (effect, colors, o={}) => ({
  effect, speed:o.speed??96, period:o.period??5, brightness:o.brightness??255, colors:colors.slice() });
const WARM=[255,145,65], PINK=[255,40,90], ORANGE=[255,90,0];
function newPreset(name){
  return { name:name||"新規プリセット", enFront:true, enBack:true, enGround:true,
    front:newChan(0,[WARM]), back:newChan(1,[PINK,ORANGE],{speed:64,brightness:230}),
    ground:newChan(0,[WARM],{brightness:90}) }; }

let lib = load(); let curIdx = lib.length ? 0 : -1;
function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||[]; }catch(e){ return []; } }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(lib)); }
if(!lib.length){ lib=[newPreset("暖白のみ"), newPreset("暖白＋桃橙ブレス")];
  lib[0].enBack=false; lib[0].back=newChan(0,[WARM]); save(); curIdx=0; }
// 旧2チャンネル(Front/Back)プリセットにGroundを補完
lib.forEach(p=>{ if(!p.ground) p.ground=newChan(0,[WARM],{brightness:90});
  if(p.enGround===undefined) p.enGround=true; });

const toHex = c => '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
const fromHex = h => [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];
// 実機の見え方に寄せる：LEDはリニア、モニタはsRGB。逆ガンマで中間を明るく＝白っぽく見せる
const VIEW_GAMMA = 2.2;
const ledView = c => c.map(v => Math.round(255*Math.pow(v/255, 1/VIEW_GAMMA)));
function swatchEl(colors){ const s=document.createElement('span'); s.className='swatch';
  colors.slice(0,6).forEach(c=>{ const b=document.createElement('i'); b.style.background=toHex(ledView(c)); s.appendChild(b); }); return s; }

// ===== タブ =====
function setTab(op){
  $('tabBtnOp').classList.toggle('act',op); $('tabBtnCr').classList.toggle('act',!op);
  $('pageOp').classList.toggle('act',op);   $('pageCr').classList.toggle('act',!op);
}
$('tabBtnOp').onclick=()=>setTab(true);
$('tabBtnCr').onclick=()=>setTab(false);

// ===== シリアライズ（ファーム47byteと一致）=====
function encodeChan(ch){ const a=new Uint8Array(23);
  a[0]=ch.effect; a[1]=ch.speed; a[2]=ch.period; a[3]=ch.brightness; a[4]=ch.colors.length;
  ch.colors.forEach((c,i)=>{ a[5+i*3]=c[0]; a[6+i*3]=c[1]; a[7+i*3]=c[2]; }); return a; }
function encodePreset(p){ const b=new Uint8Array(70);
  b.set(encodeChan(p.front),0); b.set(encodeChan(p.back),23); b.set(encodeChan(p.ground),46);
  b[69]=(p.enFront?1:0)|(p.enBack?2:0)|(p.enGround?4:0); return b; }
function decodeChan(dv,off){ const nc=dv.getUint8(off+4), colors=[];
  for(let i=0;i<nc;i++) colors.push([dv.getUint8(off+5+i*3),dv.getUint8(off+6+i*3),dv.getUint8(off+7+i*3)]);
  return { effect:dv.getUint8(off),speed:dv.getUint8(off+1),period:dv.getUint8(off+2),
           brightness:dv.getUint8(off+3),colors:colors.length?colors:[[255,255,255]] }; }
function decodePreset(dv){ return { name:'', front:decodeChan(dv,0), back:decodeChan(dv,23), ground:decodeChan(dv,46),
  enFront:!!(dv.getUint8(69)&1), enBack:!!(dv.getUint8(69)&2), enGround:!!(dv.getUint8(69)&4) }; }

// ===== BLE =====
let dev,chState,chSlot,chPData,chCmd;
let numSlots=8, activeSlot=0, deviceSlots=[], channelMask=7;
const connected = ()=>!!(dev&&dev.gatt&&dev.gatt.connected);
async function wc(ch,arr){ const b=new Uint8Array(arr);
  if(ch.writeValueWithResponse) await ch.writeValueWithResponse(b); else await ch.writeValue(b); }

$('btnConnect').onclick=async()=>{
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[UUID.svc]},{name:'NuiLED'}],optionalServices:[UUID.svc]});
    dev.addEventListener('gattserverdisconnected',onDisc);
    const s=await dev.gatt.connect(); const svc=await s.getPrimaryService(UUID.svc);
    chState=await svc.getCharacteristic(UUID.state); chSlot=await svc.getCharacteristic(UUID.slot);
    chPData=await svc.getCharacteristic(UUID.pdata); chCmd=await svc.getCharacteristic(UUID.cmd);
    await chState.startNotifications();
    chState.addEventListener('characteristicvaluechanged',e=>parseState(e.target.value));
    parseState(await chState.readValue());
    setConn(true);
    await syncSlots();
    setTab(true);
  }catch(e){ $('connText').textContent='接続失敗: '+e.message; }
};
$('btnDisconnect').onclick=()=>{ if(dev&&dev.gatt.connected) dev.gatt.disconnect(); };
function onDisc(){ setConn(false); }

function setConn(on){
  $('dot').className=on?'on':''; $('connText').textContent=on?'接続済み':'未接続';
  $('btnConnect').classList.toggle('hide',on); $('btnDisconnect').classList.toggle('hide',!on);
  ['opGlobal','opSlots','crXfer'].forEach(id=>$(id).classList.toggle('offline',!on));
  $('opHint').classList.toggle('hide',on);
  if(on){ const sel=$('devSlot'); if(!sel.options.length)
    for(let i=0;i<numSlots;i++) sel.add(new Option('スロット '+i,i)); }
}

function parseState(dv){
  const power=dv.getUint8(0); activeSlot=dv.getUint8(2); channelMask=dv.getUint8(3); numSlots=dv.getUint8(4)||8;
  $('btnPower').textContent = power?'電源 OFF':'電源 ON';
  renderChBtns(); renderSlots();
}
function renderChBtns(){ document.querySelectorAll('.chtog').forEach(b=>
  b.classList.toggle('fill', !!(channelMask & +b.dataset.b))); }

// ===== 本体スロット一覧 =====
async function syncSlots(){
  deviceSlots=[];
  for(let i=0;i<numSlots;i++){ await wc(chSlot,[i]); deviceSlots[i]=decodePreset(await chPData.readValue()); }
  renderSlots();
}
function chanLine(tag, ch, en){
  const line=document.createElement('div'); line.className='cline';
  const t=document.createElement('span'); t.className='tag'; t.textContent=tag; line.appendChild(t);
  if(!en){ const s=document.createElement('span'); s.className='muted'; s.textContent='—'; line.appendChild(s); return line; }
  const nm=document.createElement('span'); nm.textContent=EFFECTS[ch.effect]||'?'; line.appendChild(nm);
  line.appendChild(swatchEl(ch.colors)); return line;
}
function renderSlots(){
  const box=$('slotList'); if(!box) return; box.innerHTML='';
  deviceSlots.forEach((p,i)=>{
    const card=document.createElement('button'); card.className='slotcard'+(i===activeSlot?' active':'');
    const no=document.createElement('div'); no.className='no'; no.textContent=i; card.appendChild(no);
    const info=document.createElement('div'); info.className='info';
    info.appendChild(chanLine('F', p.front, p.enFront));
    info.appendChild(chanLine('B', p.back, p.enBack));
    info.appendChild(chanLine('G', p.ground, p.enGround));
    card.appendChild(info);
    if(i===activeSlot){ const b=document.createElement('span'); b.className='badge'; b.textContent='点灯中'; card.appendChild(b); }
    card.onclick=()=>{ if(connected()) wc(chCmd,[CMD.APPLY,i]); };
    box.appendChild(card);
  });
}
$('btnSync').onclick=()=>{ if(connected()) syncSlots(); };
// 現在モード（点灯中スロット）のFront/Backを即入れ替え（ライブ。NVS保存は作成タブから）
$('btnSwapLive').onclick=async()=>{
  if(!connected()||!deviceSlots[activeSlot]) return;
  const p=deviceSlots[activeSlot];
  [p.front,p.back]=[p.back,p.front]; [p.enFront,p.enBack]=[p.enBack,p.enFront];
  await wc(chSlot,[activeSlot]); await wc(chPData,Array.from(encodePreset(p)));
  await wc(chCmd,[CMD.APPLY,activeSlot]); await syncSlots();
};

// 全体操作
$('btnPower').onclick=()=>wc(chCmd,[CMD.POWER, $('btnPower').textContent.includes('ON')?1:0]);
document.querySelectorAll('.bri').forEach(b=>b.onclick=()=>wc(chCmd,[CMD.BRIGHTNESS,+b.dataset.i]));
// Front/Back/Ground は独立トグル（ビットXOR）。全ては一括ON
$('chAll').onclick=()=>{ if(connected()) wc(chCmd,[CMD.CHANNEL,7]); };
document.querySelectorAll('.chtog').forEach(b=>b.onclick=()=>{ if(connected()) wc(chCmd,[CMD.CHANNEL, channelMask ^ +b.dataset.b]); });

// ===== ライブラリ / 編集 =====
function renderLib(){
  const ul=$('libList'); ul.innerHTML='';
  lib.forEach((p,i)=>{
    const li=document.createElement('li'); if(i===curIdx) li.className='sel';
    li.appendChild(swatchEl(p.front.colors.concat(p.back.colors)));
    const nm=document.createElement('span'); nm.className='name'; nm.textContent=p.name;
    nm.onclick=()=>{ curIdx=i; renderAll(); };
    li.appendChild(nm); ul.appendChild(li);
  });
}
function chanEditor(hostId, chanKey, title){
  const p=lib[curIdx], ch=p[chanKey], enabled=chanKey==='front'?p.enFront:p.enBack;
  const host=$(hostId); host.innerHTML='';
  const box=document.createElement('div'); box.className='chan'; box.innerHTML=`<h3>${title}</h3>`;
  if(!enabled){ box.style.opacity=.5; }
  const eff=document.createElement('select'); EFFECTS.forEach((n,i)=>eff.add(new Option(n,i)));
  eff.value=ch.effect; eff.onchange=()=>{ ch.effect=+eff.value; save(); chanEditor(hostId,chanKey,title); renderLib(); };
  box.appendChild(mkField('演出', eff));
  box.appendChild(mkRange('明るさ', ch.brightness, v=>{ ch.brightness=v; save(); }));
  if(ch.effect!==0) box.appendChild(mkRange('速度', ch.speed, v=>{ ch.speed=v; save(); }));
  if(ch.effect===2) box.appendChild(mkRange('周期(LED)', ch.period, v=>{ ch.period=v; save(); }, 1, 30));
  const palLabel=document.createElement('label'); palLabel.textContent = ch.effect===0?'色':'パレット'; box.appendChild(palLabel);
  const pal=document.createElement('div'); pal.className='pal';
  ch.colors.forEach((c,i)=>{
    const wrap=document.createElement('span'); wrap.className='c';
    const inp=document.createElement('input'); inp.type='color'; inp.value=toHex(c);
    inp.oninput=()=>{ ch.colors[i]=fromHex(inp.value); save(); renderLib(); };
    wrap.appendChild(inp);
    if(ch.colors.length>1){ const x=document.createElement('button'); x.className='x'; x.textContent='×';
      x.onclick=()=>{ ch.colors.splice(i,1); save(); chanEditor(hostId,chanKey,title); renderLib(); }; wrap.appendChild(x); }
    pal.appendChild(wrap);
  });
  if(ch.effect!==0 && ch.colors.length<MAX_COLORS){ const add=document.createElement('button'); add.className='sm'; add.textContent='＋色';
    add.onclick=()=>{ ch.colors.push([255,255,255]); save(); chanEditor(hostId,chanKey,title); renderLib(); }; pal.appendChild(add); }
  box.appendChild(pal);
  const pl=document.createElement('label'); pl.textContent='プレビュー'; box.appendChild(pl);
  const cv=document.createElement('canvas'); cv.className='preview'; cv.width=PREVIEW_N*5; cv.height=22; box.appendChild(cv);
  previews[chanKey]={ canvas:cv, ctx:cv.getContext('2d'), get:()=>lib[curIdx]?lib[curIdx][chanKey]:null,
    buf:Array.from({length:PREVIEW_N},()=>[0,0,0]) };
  host.appendChild(box);
}
function mkField(label,el){ const d=document.createElement('div'); const l=document.createElement('label'); l.textContent=label;
  d.appendChild(l); d.appendChild(el); return d; }
function mkRange(label,val,cb,min=0,max=255){ const d=document.createElement('div');
  const l=document.createElement('label'); l.textContent=label; const v=document.createElement('span');
  v.className='val'; v.textContent=' '+val; l.appendChild(v);
  const r=document.createElement('input'); r.type='range'; r.min=min; r.max=max; r.value=val;
  r.oninput=()=>{ v.textContent=' '+r.value; cb(+r.value); }; d.appendChild(l); d.appendChild(r); return d; }
function renderEditor(){
  if(curIdx<0){ $('editor').classList.add('hide'); return; } $('editor').classList.remove('hide');
  const p=lib[curIdx]; $('pName').value=p.name;
  $('enFront').checked=p.enFront; $('enBack').checked=p.enBack; $('enGround').checked=p.enGround;
  chanEditor('chFront','front','Front（照明）'); chanEditor('chBack','back','Back（背景）');
  chanEditor('chGround','ground','Ground（床）');
}
$('pName').oninput=()=>{ lib[curIdx].name=$('pName').value; save(); renderLib(); };
$('enFront').onchange =()=>{ lib[curIdx].enFront =$('enFront').checked; save(); renderEditor(); };
$('enBack').onchange  =()=>{ lib[curIdx].enBack  =$('enBack').checked; save(); renderEditor(); };
$('enGround').onchange=()=>{ lib[curIdx].enGround=$('enGround').checked; save(); renderEditor(); };
$('btnSwapFB').onclick=()=>{ const p=lib[curIdx];
  [p.front,p.back]=[p.back,p.front]; [p.enFront,p.enBack]=[p.enBack,p.enFront]; save(); renderEditor(); renderLib(); };
$('btnNew').onclick=()=>{ lib.push(newPreset()); curIdx=lib.length-1; save(); renderAll(); };
$('btnDup').onclick=()=>{ const c=JSON.parse(JSON.stringify(lib[curIdx])); c.name+=" 複製"; lib.splice(curIdx+1,0,c); curIdx++; save(); renderAll(); };
$('btnDel').onclick=()=>{ if(!confirm('このプリセットを削除しますか？'))return; lib.splice(curIdx,1); curIdx=Math.min(curIdx,lib.length-1); save(); renderAll(); };
function renderAll(){ renderLib(); renderEditor(); }

// 転送
$('btnSend').onclick=async()=>{ if(!connected())return; const slot=+$('devSlot').value;
  await wc(chSlot,[slot]); await wc(chPData, Array.from(encodePreset(lib[curIdx]))); await wc(chCmd,[CMD.APPLY,slot]); await syncSlots(); };
$('btnSaveNvs').onclick=()=>{ if(connected()) wc(chCmd,[CMD.SAVE]); };
$('btnFactory').onclick=async()=>{ if(!connected())return; if(confirm('本体を工場出荷に戻します。よろしいですか？')){ await wc(chCmd,[CMD.FACTORY]); await syncSlots(); } };
$('btnImport').onclick=async()=>{ if(!connected())return; const slot=+$('devSlot').value;
  await wc(chSlot,[slot]); const p=decodePreset(await chPData.readValue()); p.name='スロット'+slot+'取込';
  lib.push(p); curIdx=lib.length-1; save(); renderAll(); setTab(false); };

// ===== 動くプレビュー =====
const PREVIEW_N = 60; let previews = {};
const mapJS=(v,a,b,c,d)=>Math.floor((v-a)*(d-c)/(b-a))+c;
const scale8JS=(x,s)=>Math.floor(x*s/255);
const blendJS=(a,b,f)=>[0,1,2].map(k=>Math.round(a[k]+(b[k]-a[k])*f/255));
const nscaleV=(c,s)=>c.map(v=>v===0?0:Math.max(1,Math.floor(v*s/255)));
const beatsin8JS=(bpm,t)=>Math.round(128+127*Math.sin((t/60000)*bpm*2*Math.PI));
const palC=(ch,i)=>{const n=ch.colors.length||1;return ch.colors[i%n].slice();};
function paletteAtJS(ch,t){ const n=ch.colors.length||1; if(n===1)return palC(ch,0);
  const s=t*n, seg=Math.floor(s/256), f=s&255; return blendJS(palC(ch,seg%n),palC(ch,(seg+1)%n),f); }
function renderChannelJS(ch,n,t,buf){ const nc=ch.colors.length||1, out=buf;
  switch(ch.effect){
    case 0: for(let i=0;i<n;i++) out[i]=palC(ch,0); break;
    case 1:{ const bpm=mapJS(ch.speed,0,255,4,30);
      if(nc>=2){ const col=paletteAtJS(ch,beatsin8JS(bpm,t)); for(let i=0;i<n;i++) out[i]=col.slice(); }
      else{ const col=nscaleV(palC(ch,0),scale8JS(beatsin8JS(bpm,t),200)+55); for(let i=0;i<n;i++) out[i]=col.slice(); } break; }
    case 2:{ const blk=ch.period||1, scroll=ch.speed===0?0:Math.floor(t/mapJS(ch.speed,1,255,400,20));
      for(let i=0;i<n;i++) out[i]=palC(ch,Math.floor((i+scroll)/blk)%nc); break; }
    case 3:{ const denom=17-mapJS(ch.speed,0,255,2,15);
      for(let i=0;i<n;i++) out[i]=paletteAtJS(ch,(i*8+Math.floor(t/denom))&255); break; }
    case 4:{ for(let i=0;i<n;i++) out[i]=out[i]?out[i].map(v=>Math.floor(v*215/255)):[0,0,0];
      const div=Math.max(1,mapJS(ch.speed,0,255,80,10)), step=Math.floor(t/div);
      for(let k=0;k<nc;k++){ const pos=(step+k*Math.floor(n/nc))%n; out[pos]=nscaleV(palC(ch,k),ch.brightness); } return out; }
  }
  if(ch.brightness<255) for(let i=0;i<n;i++) out[i]=nscaleV(out[i],ch.brightness); return out; }
function animate(t){
  for(const key in previews){ const pv=previews[key];
    if(!pv.canvas.isConnected){ delete previews[key]; continue; }
    const ch=pv.get(); if(!ch) continue;
    const cols=renderChannelJS(ch,PREVIEW_N,t,pv.buf);
    const g=pv.ctx, W=pv.canvas.width, H=pv.canvas.height, w=W/PREVIEW_N;
    for(let i=0;i<PREVIEW_N;i++){ const c=ledView(cols[i]); g.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`; g.fillRect(i*w,0,Math.ceil(w),H); }
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// init
if(!navigator.bluetooth){ $('btnConnect').disabled=true;
  $('btEnv').textContent='このブラウザはWeb Bluetooth非対応（Android Chrome / PC Chrome・Edge推奨）。'; }
renderAll();
</script>
